name: CI

# No paths-ignore: `ci` is a REQUIRED status check in the main ruleset, so a
# PR that skipped this workflow (e.g. docs-only) could never merge. The run is
# ~1 minute, and Prettier checks .md files too.
on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Format (Prettier)
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Fixture Tests (mini)
        run: npm run mini
